name: Build ImmortalWrt for NanoPi R3S

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "ImmortalWrt 源码分支"
        required: true
        default: "master"
        type: choice
        options:
          - master
          - openwrt-24.10

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO_URL: https://github.com/immortalwrt/immortalwrt
      REPO_BRANCH: ${{ inputs.branch }}
      CONFIG_FILE: r3s-seed.config
      DIY_SCRIPT: scripts/diy.sh

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --force --all || true
          df -hT

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            clang cmake cpio curl device-tree-compiler flex gawk gettext gcc-multilib g++-multilib git gnutls-dev \
            gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons \
            squashfs-tools subversion swig texinfo unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: 克隆 ImmortalWrt 源码
        run: |
          df -hT $PWD
          git clone --depth=1 -b $REPO_BRANCH $REPO_URL openwrt

      - name: 运行 DIY 脚本（引入 luci-app-daed）
        run: |
          chmod +x $DIY_SCRIPT
          cd openwrt
          ../$DIY_SCRIPT

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载固件配置
        run: |
          cd openwrt
          cp ../$CONFIG_FILE .config
          make defconfig
          cat .config | grep -E "(daed|naive|passwall|upnp|R3S)" || true

      - name: 下载软件包
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 整理固件文件
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
          ls -lh

      - name: 上传固件到 Artifacts
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-r3s-${{ inputs.branch }}
          path: ${{ env.FIRMWARE_PATH }}

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: openwrt/logs
